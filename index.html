<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KataHub</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">


<div class="logo">
KataHub
</div>


<input 
class="search"
placeholder="Cari posting..."
>


<div class="icons">
🔔 👤
</div>


</header>





<div class="container">


<aside class="left">


<div class="user-card">


<div class="avatar">
👤
</div>


<div id="profile">
Loading...
</div>


<div class="point">

⚡
<span id="credit">
0
</span>
kredit

</div>


</div>




<div class="menu">

<div>🏠 Beranda</div>

<div>🔥 Trending</div>

<div>⭐ Favorit</div>

<div>⚙ Pengaturan</div>


</div>


</aside>







<section class="center">



<div class="create">


<textarea 
id="text"
placeholder="Apa yang ingin kamu bagikan?"
></textarea>


<button id="postBtn"
onclick="post()">

Posting

</button>


</div>





<div id="feed">


<div class="loading">
Memuat feed...
</div>


</div>




</section>








<aside class="right">


<div class="box">

<h3>
Aktivitas
</h3>

<p>
15 menit aktif
=
1 kredit
</p>

</div>


<div class="box">

<h3>
Tips
</h3>

<p>
Gunakan poin untuk posting dan komentar
</p>

</div>


</aside>



</div>







<nav class="mobile-menu">


<div>🏠</div>

<div>🔍</div>

<div onclick="focusPost()">
➕
</div>

<div>👤</div>


</nav>



<script src="config.js"></script>

<script src="app.js"></script>


</body>


</html>
