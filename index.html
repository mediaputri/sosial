<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KataHub</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="topbar">

<div class="brand">
KataHub
</div>


<div class="search">

🔍 Cari kata...

</div>


<div class="top-menu">

🔔 ⚙️ 👤

</div>


</header>





<div class="layout">



<aside class="left-sidebar">


<div class="profile-card">


<div class="avatar">
👤
</div>


<div id="profile">

</div>


<div class="credit">

⚡ Kredit :
<span id="credit">
0
</span>

</div>


</div>




<nav>


<div>
🏠 Beranda
</div>


<div>
🔥 Populer
</div>


<div>
⭐ Favorit
</div>


<div>
👥 Komunitas
</div>


</nav>


</aside>








<main class="feed-area">



<div class="create-box">


<textarea
id="text"
placeholder="Apa yang sedang kamu pikirkan?"
></textarea>


<button onclick="post()">
Posting
</button>


</div>





<div id="feed">

</div>




</main>








<aside class="right-sidebar">


<div class="widget">


<h3>
Status
</h3>


<p>
Pengguna aktif
</p>


<p>
🔥 Sistem poin berjalan
</p>


</div>





<div class="widget">


<h3>
Panduan
</h3>


<p>
15 menit aktif = 1 kredit</p>


<p>
1 posting = 1 kredit</p>


</div>



</aside>




</div>





<nav class="mobile-nav">

🏠
🔍
➕
👤

</nav>



<script src="config.js"></script>

<script src="app.js"></script>


</body>

</html>
